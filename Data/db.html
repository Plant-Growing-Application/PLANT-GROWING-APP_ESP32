<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Kayıtları</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="db-container">
        <header>
            <h2>📊 Sensor Kayıtları</h2>
            <button onclick="window.location.href='/'">⬅ Geri</button>
        </header>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Değer</th>
                    <th>Zaman</th>
                </tr>
            </thead>
            <tbody id="db-body">
                <tr>
                    <td colspan="3">Yükleniyor...</td>
                </tr>
            </tbody>
        </table>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="refresh-btn" onclick="loadData()">🔄 Yenile</button>
            <button class="clear-btn" onclick="clearDb()">🧹 Temizle</button>
        </div>
    </div>

    <script>
        function loadData() {
            fetch('/api/sensor')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('db-body');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3">Kayıt yok</td></tr>';
                        return;
                    }

                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.id}</td>
                            <td>${row.value}</td>
                            <td>${new Date(row.created * 1000).toLocaleString()}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(() => {
                    document.getElementById('db-body').innerHTML =
                        '<tr><td colspan="3">Hata oluştu</td></tr>';
                });
        }

        function clearDb() {
            if (!confirm("Tüm sensor kayıtları silinsin mi?")) return;

            fetch('/api/clear-sensor', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        loadData();
                    } else {
                        alert("❌ Silme başarısız");
                    }
                })
                .catch(() => {
                    alert("❌ Sunucu hatası");
                });
        }

        loadData();
    </script>
</body>

</html>
