<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Kontrol Paneli</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .db-container {
      margin-top: 25px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f4f4f4;
      font-weight: bold;
    }

    .refresh-btn {
      margin-top: 8px;
      background: #4caf50;
      color: white;
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="wifi-card control-card">

    <header class="panel-header">
      <h2>🌱 ESP32 Kontrol Paneli</h2>
      <button id="wifi-btn" onclick="window.location.href='/wifi'">📶 Wi-Fi Ayarları</button>
    </header>

    <div id="wifi-mode" class="status-text">Bağlanıyor...</div>

    <div class="relay-container">
      <button id="r1" class="btn off" onclick="sendCmd(1)">Röle 1</button>
      <button id="r2" class="btn off" onclick="sendCmd(2)">Röle 2</button>
    </div>

    <footer>
      <p>IP: <span id="ip">Yükleniyor...</span></p>
    </footer>
    <script src="/script.js"></script>
</body>

</body>
</html>
