<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Kontrol Paneli</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>🌱 ESP32 Web Panel</h2>
  <div id="wifi-mode" class="info">Bağlanıyor...</div>

  <div class="relay-container">
    <button id="r1" class="btn off" onclick="sendCmd(1)">Röle 1</button>
    <button id="r2" class="btn off" onclick="sendCmd(2)">Röle 2</button>
  </div>

  <footer>
    <p>IP: <span id="ip">Yükleniyor...</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
