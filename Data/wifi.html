<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALIXUS | WiFi Kurulumu</title>

  <!-- Local Bootstrap -->
  <link rel="stylesheet" href="/bootstrap.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/style.css">
</head>

<body data-page="wifi">

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="wifi-setup-card">

      <div class="text-center mb-4">
        <div class="wifi-brand">SALIXUS</div>
        <div class="wifi-icon-circle">
          <span>🌐</span>
        </div>
        <h4 class="mt-3 fw-bold">WiFi Bağlantısı</h4>
      </div>

      <!-- FORM BAŞLANGIÇ -->
      <form id="wifiForm" method="POST" action="/saveWiFi">

        <!-- WiFi Scan -->
        <div class="mb-4">
          <label class="form-label text-grey small fw-bold">AĞ SEÇİN (SSID)</label>

          <div class="d-flex gap-2">
            <select id="networks" name="ssid" class="form-select">
              <option value="">-- Tarama yap --</option>
            </select>

            <button type="button" class="btn btn-scan" onclick="scanNetworks()">
              TARA
            </button>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-4">
          <label class="form-label text-grey small fw-bold">WIFI ŞİFRESİ</label>

          <div class="password-wrapper position-relative">
            <input type="password" id="pass" name="pass" class="form-control custom-input" placeholder="••••••••">

            <!-- Göster / Gizle -->
            <button type="button" class="pass-toggle-btn" onclick="togglePass()">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-connect w-100">
          SİSTEMİ BAĞLA
        </button>

      </form>
      <!-- FORM BİTİŞ -->

    </div>
  </div>

  <!-- JS -->
  <script src="/script.js"></script>

</body>
</html>
