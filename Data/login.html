<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALIXUS | Giriş Yap</title>
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="brand-name">SALIXUS</div>
                <div class="user-icon-circle">
                    <span>👤</span>
                </div>
                <h4 class="mt-3 fw-bold">Yönetici Girişi</h4>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-grey small fw-bold">KULLANICI ADI</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control custom-input" placeholder="admin">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-grey small fw-bold">ŞİFRE</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPass" class="form-control custom-input" placeholder="••••••••">
                        <span class="input-icon">🔑</span>
                    </div>
                </div>

                <button type="button" class="btn btn-login-action w-100" onclick="performLogin()">
                    OTURUM AÇ
                </button>
            </form>

            <div class="text-center mt-4 d-center justify-content-between">
                <a href="index.html" class="back-link">← Geri Dön</a>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
    </body>

</html>
