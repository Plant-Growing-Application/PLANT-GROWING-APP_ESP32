<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALIXUS | İlk Kurulum</title>
    <link rel="stylesheet" href="/bootstrap.min.css">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --neon-green: #00ff88;
            --gray-text: #999;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        .setup-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            letter-spacing: 4px;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .user-icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 2rem;
            border: 1px solid var(--neon-green);
        }

        .input-wrapper {
            position: relative;
        }

        .custom-input {
            background-color: #222 !important;
            border: 2px solid #333 !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 12px !important;
        }

        .custom-input:focus {
            border-color: var(--neon-green) !important;
            box-shadow: none !important;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
        }

        .btn-setup {
            background: var(--neon-green);
            color: var(--bg-dark);
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            letter-spacing: 1px;
            border: none;
            transition: 0.3s;
        }

        .btn-setup:hover {
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
            transform: translateY(-2px);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--gray-text);
        }
    </style>
</head>

<body data-page="setup">

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="setup-card text-center">

            <div class="brand-name">SALIXUS</div>

            <div class="user-icon-circle mb-3">
                🛠️
            </div>

            <h5 class="fw-bold mb-1">İlk Kurulum</h5>
            <p class="hint-text mb-4">
                Bu cihaz için yönetici hesabı oluştur
            </p>

            <form id="setupForm">

                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-secondary">KULLANICI ADI</label>
                    <div class="input-wrapper">
                        <input type="text" id="setupUser" class="form-control custom-input" placeholder="admin">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-secondary">ŞİFRE</label>
                    <div class="input-wrapper">
                        <input type="password" id="setupPass" class="form-control custom-input" placeholder="••••••••">
                        <span class="input-icon">🔑</span>
                    </div>
                </div>

                <button type="button" class="btn btn-setup w-100" onclick="createAdmin()">
                    HESABI OLUŞTUR
                </button>

            </form>

        </div>
    </div>

    <script>
        async function createAdmin() {
            const username = document.getElementById("setupUser").value.trim();
            const password = document.getElementById("setupPass").value.trim();

            if (!username || !password) {
                alert("Kullanıcı adı ve şifre boş olamaz");
                return;
            }

            try {
                const res = await fetch("/api/setup-user", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await res.json();

                if (data.ok) {
                    alert("Kurulum tamamlandı, giriş sayfasına yönlendiriliyorsun");
                    window.location.href = "/login";
                } else {
                    alert("Kurulum başarısız: " + (data.error || "bilinmeyen hata"));
                }

            } catch (err) {
                alert("Sunucuya bağlanılamadı");
            }
        }
    </script>


</body>

</html>
