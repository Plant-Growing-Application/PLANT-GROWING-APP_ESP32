; Topraksız Tarım Sistemi — PlatformIO yapılandırması
;
; `pio run` yalnızca firmware derler. Host testleri ayrı istenir:
;     pio test -e native
[platformio]
default_envs = esp32dev

;
; Pin planı ve bölümleme gerekçeleri: docs/HARDWARE.md
; Mimari kararlar: ARCHITECTURE.md §15.2 (SQLite kaldırıldı, OTA etkin)

[env:esp32dev]
platform  = espressif32 @ 6.12.0
board     = esp32dev
framework = arduino

; --- Flash düzeni ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- Derleme ---
build_flags =
    -Wall
    -Wextra

; --- Kütüphaneler -------------------------------------------------------
; Sürüme sabitlendi: git URL'leri kullanılmıyor. Gerekçe (ISSUE-007):
; me-no-dev/ESPAsyncWebServer.git deposu devredildi ve URL sessizce farklı
; bir projeye (ESP32Async 3.6.0) yönlenerek derlemeyi kırdı.
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0

; ESPAsyncWebServer 3.x, framework'ün senkron WebServer kütüphanesini bağımlılık
; grafiğine sokar. `chain` modunda include yolu yayılmadığı için deep+ gerekiyor.
lib_ldf_mode = deep+

; --- Seri port ---
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
; upload_port bilinçli olarak tanımlı DEĞİL — otomatik tespit edilir.

; --- Host (native) test ortamı — TASK-064 ------------------------------------
; `domain/` ve `core/` katmanları donanımdan bağımsız olduğu için testler
; PC'de koşabilir: `pio test -e native`
;
; Yalnızca donanımsız derlenebilen kaynaklar dahil edilir. `hal/`, `tasks/`
; ve `interfaces/` bilinçli olarak DIŞARIDA — onlar donanım gerektirir.
[env:native]
platform      = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
    -Wall
    -Wextra
build_src_filter =
    +<core/ConfigValidation.cpp>
    +<core/CropProfile.cpp>
test_build_src = yes
